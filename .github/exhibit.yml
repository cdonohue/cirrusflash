# Exhibit reads this file from the tip of the pull request's base branch,
# so a pull request cannot change its own config.

# Where the base and head of a pull request are deployed.
# {branch} is the branch name in DNS form, as Cloudflare names previews.
preview:
  base: https://stratobeam.chad-donohue.workers.dev
  head: https://{branch}-stratobeam.chad-donohue.workers.dev

# Pages to capture on every pull request.
routes:
  always: [/]

# Notes for the agent about this app (data, not instructions).
instructions: |
  Stratobeam is a single-page app with fixed demo data; state resets on reload.
  Account "Acme Robotics" has the domains acme-robotics.example (10 DNS records),
  shop.acme-robotics.example and status.acme.test, and the workers api-gateway,
  image-resizer and webhook-relay. Add ?theme=dark or ?theme=light to any path to
  force a color theme; it is kept while navigating inside the app.
  The design system is @cloudflare/kumo.

# The merge policy: Exhibit posts the check "Exhibit policy". It passes, or it
# needs a human; an approving review from a writer clears it. Each metric holds
# the PR for a human (`then: human`) or passes it with a note (`then: note`).
policy:
  intentional:   { below: 0.5, then: human }                  # only clear mismatches; Clef varies about ±10% between runs
  design-system: { package: "@cloudflare/kumo", then: note }
  public-api:    { files: [src/data/types.ts, src/lib/**], then: human }
  accessibility: { impact: serious, then: human }
  side-effects:  { then: note }

# Exhibit turns on GitHub's auto-merge when the check passes (or a writer approves).
# GitHub merges when every required check is done. The targets above decide the check.
merge: auto
